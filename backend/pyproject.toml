[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cube-solver==1.1.4",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: hundreds of real solves"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
strict = true

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[[tool.mypy.overrides]]
module = ["cube_solver", "cube_solver.*"]
ignore_missing_imports = true
